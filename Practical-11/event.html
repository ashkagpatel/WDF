<html>
    <head>
       <title>Event</title> 
       <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="header">
        <h1>CHARUSAT</h1>
        </div>
        <a href="dashboard.html">Back</a>
        
       
           <h4>EVENTS</h4>
        
        <br>
        <div id="content">
             <p>
                The Events page provides information about upcoming
                college activities such as technical festivals,
                workshops, seminars, sports events, and cultural
                programs organized for students.
            </p>

            <br>
            
            <h4>Upcoming Events</h4>

            <div class="slider">

             <label for="eventFilter">Filter by Category:</label>

<select id="eventFilter">
    <option value="all">All</option>
    <option value="Technical">Technical</option>
    <option value="Sports">Sports</option>
    <option value="Workshop">Workshop</option>
    <option value="Cultural">Cultural</option>
</select>

<label for="eventSort">Sort By:</label>

<select id="eventSort">
    <option value="none">None</option>
    <option value="title">Title (A-Z)</option>
    <option value="date">Date</option>
</select>

                <div id="eventContainer"></div>
   
    <div class="slider-buttons">
        <button id="prev">Previous</button>
        <span id="slideNumber">1/5</span>
        <button id="next">Next</button>
    </div>

</div>

        </div>
        
    <script src="script.js"></script>

    </body>
</html>
