<html>
    <head>
        <title>Student Profile</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div id="header">
            <h1>CHARUSAT</h1>
        </div>

        <a href="dashboard.html" class="back">Back</a>

        <h4>STUDENT PROFILE</h4>

        <div class="profile-card">

            <h2>Enter Student Information</h2>

            <form>

                <div class="profile-form">

                    <div>
                        <label>Student Name:</label>
                        <input type="text" placeholder="Enter your name">
                    </div>

                    <div>
                        <label>ID No:</label>
                        <input type="text" placeholder="Enter ID number">
                    </div>

                    <div>
                        <label>Gender:</label>
                        <input type="text" placeholder="Enter gender">
                    </div>

                    <div>
                        <label>Blood Group:</label>
                        <input type="text" placeholder="Enter blood group">
                    </div>

                    <div>
                        <label>Birth Date:</label>
                        <input type="text" placeholder="DD-MM-YYYY">
                    </div>

                    <div>
                        <label>Birth Place:</label>
                        <input type="text" placeholder="Enter birth place">
                    </div>

                    <div>
                        <label>Nationality:</label>
                        <input type="text" placeholder="Enter nationality">
                    </div>

                    <div>
                        <label>Mother Tongue:</label>
                        <input type="text" placeholder="Enter mother tongue">
                    </div>

                    <div>
                        <label>Mobile No:</label>
                        <input type="tel" placeholder="Enter mobile number">
                    </div>

                </div>

                <div class="profile-buttons">
                    <input type="submit" value="Save Profile">
                    <input type="reset" value="Clear">
                </div>

            </form>

        </div>

    </body>
</html>
