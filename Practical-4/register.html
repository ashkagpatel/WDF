<html>
    <head>
        <title>Register</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div id="header">
        <h1>STUDENT REGISTRATION</h1>
        </div>
    </br>

       <form id="registrationform" action="login.html" method="post" class="register-box">

        <label>Full Name:-</label>
       <input type="text" id="name" placeholder="Enter full name"><br>
       <span id="nameerror" class="error"></span>
       <br><br>

       <label>Email Address:-</label>
        <input type="email" id="email" placeholder="Enter Email Address"><br>
        <span id="emailerror" class="error"></span>
        <br><br>

        <label>Password:-</label>
        <input type="password" id="ps" placeholder="Enter Password"><br>
        <span id="passworderror" class="error"></span>
        <br><br>

         <label>Confirm Password:-</label>
         <input type="password" id="cps" placeholder="Confirm your password"><br>
         <span id="cpassworderror" class="error"></span>
        <br><br>
       

       <input type="submit" value="REGISTER"> 

    </form>

      <script src="script.js"></script>


    </body>
</html>
